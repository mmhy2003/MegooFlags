# MegooFlags: HAProxy in front of three worker nodes.
# worker-1, worker-2 and worker-3 are placeholders: use your workers' hostnames or addresses.
# site.pem holds the certificate chain followed by the private key.

global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    timeout connect 5s
    # Server-sent events: a worker sends a heartbeat every 15 s, so these must stay above that.
    timeout client 75s
    timeout server 75s
    timeout tunnel 1h
    timeout http-keep-alive 10s

frontend megooflags
    bind :80
    bind :443 ssl crt /usr/local/etc/haproxy/tls/site.pem alpn h2,http/1.1
    http-request redirect scheme https unless { ssl_fc }
    option forwardfor
    http-request set-header X-Forwarded-Proto https
    # Everything else (the UI, /api/*, /metrics) stays on the control plane.
    acl megooflags_sdk path_beg /sdk/ /ofrep/
    http-request deny deny_status 404 unless megooflags_sdk
    default_backend megooflags_workers

backend megooflags_workers
    balance roundrobin
    # A worker is taken out while it is not ready, draining or revoked (503 from /readyz).
    option httpchk
    http-check send meth GET uri /readyz
    http-check expect status 200
    default-server check inter 5s fall 2 rise 2
    server worker-1 worker-1:80
    server worker-2 worker-2:80
    server worker-3 worker-3:80
