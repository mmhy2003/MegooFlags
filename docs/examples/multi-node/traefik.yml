# MegooFlags: Traefik v3 in front of three worker nodes.
# One file holds the static and the dynamic configuration: mount it at /etc/traefik/traefik.yml
# and start Traefik without command-line flags (flags would replace the file).
# worker-1, worker-2 and worker-3 are placeholders: use your workers' hostnames or addresses.

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    transport:
      respondingTimeouts:
        readTimeout: 120s
        idleTimeout: 180s

providers:
  file:
    filename: /etc/traefik/traefik.yml

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/tls/fullchain.pem
        keyFile: /etc/traefik/tls/privkey.pem

http:
  routers:
    megooflags-sdk:
      entryPoints: [websecure]
      # Everything else (the UI, /api/*, /metrics) stays on the control plane.
      rule: "PathPrefix(`/sdk/`) || PathPrefix(`/ofrep/`)"
      service: megooflags-workers
      tls: {}
  services:
    megooflags-workers:
      loadBalancer:
        servers:
          - url: "http://worker-1:80"
          - url: "http://worker-2:80"
          - url: "http://worker-3:80"
        # A worker is taken out while it is not ready, draining or revoked (503 from /readyz).
        healthCheck:
          path: /readyz
          interval: 5s
          timeout: 2s
        # Server-sent events: flush every write to the client.
        responseForwarding:
          flushInterval: -1ms
