# MegooFlags: nginx in front of three worker nodes.
# worker-1, worker-2 and worker-3 are placeholders: use your workers' hostnames or addresses.
# Open source nginx only checks health passively (max_fails). NGINX Plus can add an active
# check against the worker readiness endpoint: `health_check uri=/readyz;` in each location.

worker_processes auto;

events {
    worker_connections 4096;
}

http {
    upstream megooflags_workers {
        server worker-1:80 max_fails=2 fail_timeout=10s;
        server worker-2:80 max_fails=2 fail_timeout=10s;
        server worker-3:80 max_fails=2 fail_timeout=10s;
        keepalive 32;
    }

    server {
        listen 80;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        ssl_certificate /etc/nginx/tls/fullchain.pem;
        ssl_certificate_key /etc/nginx/tls/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;

        # HTTP/1.1 with an empty Connection header keeps upstream connections alive.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # A worker that fails or answers 503 (revoked) is skipped; POSTs are not retried.
        proxy_next_upstream error timeout http_502 http_503;

        # Server-sent events: no buffering, and a read timeout well above the 15 s heartbeat.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        location /sdk/ {
            proxy_pass http://megooflags_workers;
        }

        location /ofrep/ {
            proxy_pass http://megooflags_workers;
        }

        # Everything else (the UI, /api/*, /metrics) stays on the control plane.
        location / {
            return 404;
        }
    }
}
