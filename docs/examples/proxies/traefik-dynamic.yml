# MegooFlags behind Traefik: the dynamic configuration (see traefik.yml). The bundle runs on the
# same host with MEGOOFLAGS_SITE_ADDRESS= (empty) and MEGOOFLAGS_HTTP_PORT=8080. Traefik sets
# X-Forwarded-For and X-Forwarded-Proto.
http:
  routers:
    megooflags:
      rule: Host(`{{ env "MF_DOMAIN" }}`)
      entryPoints:
        - websecure
      service: megooflags
      tls: {}

  services:
    megooflags:
      loadBalancer:
        passHostHeader: true
        servers:
          - url: http://127.0.0.1:8080

tls:
  stores:
    default:
      defaultCertificate:
        certFile: /etc/megooflags-proxy/fullchain.pem
        keyFile: /etc/megooflags-proxy/privkey.pem
