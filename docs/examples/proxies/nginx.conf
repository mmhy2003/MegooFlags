# MegooFlags behind nginx. TLS ends here; the bundle runs on the same host with
# MEGOOFLAGS_SITE_ADDRESS= (empty) and MEGOOFLAGS_HTTP_PORT=8080.
# Install as /etc/nginx/conf.d/megooflags.conf and set server_name to your domain.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name flags.example.com;

    ssl_certificate /etc/megooflags-proxy/fullchain.pem;
    ssl_certificate_key /etc/megooflags-proxy/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SDK streams (server-sent events, /sdk/v1/stream): pass every event on at once and keep
        # idle streams open far longer than the 15 s heartbeat.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
