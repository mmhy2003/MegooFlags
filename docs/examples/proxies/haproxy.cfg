# MegooFlags behind HAProxy (3.0 or later). TLS ends here; the bundle runs on the same host with
# MEGOOFLAGS_SITE_ADDRESS= (empty) and MEGOOFLAGS_HTTP_PORT=8080.
# Install as /usr/local/etc/haproxy/haproxy.cfg (the official image) or /etc/haproxy/haproxy.cfg.
global
    log stdout format raw local0

defaults
    mode http
    log global
    option httplog
    option forwardfor
    timeout connect 5s
    timeout http-request 10s
    # SDK streams (server-sent events) stay open for hours; keep idle connections far longer than
    # the 15 s heartbeat. HAProxy passes every event on at once.
    timeout client 1h
    timeout server 1h
    timeout tunnel 1h

crt-store megooflags
    crt-base /etc/megooflags-proxy
    key-base /etc/megooflags-proxy
    load crt "fullchain.pem" key "privkey.pem"

frontend https
    bind :443 ssl crt "@megooflags/fullchain.pem"
    http-request set-header X-Forwarded-Proto https
    default_backend megooflags

backend megooflags
    server bundle 127.0.0.1:8080
