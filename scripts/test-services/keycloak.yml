# The identity provider of the SSO end-to-end tests (api/tests/test_sso_keycloak.py), the keycloak
# service of deploy/compose.ci.yml (megoocolab.toml; the runner picks the port).
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ../../deploy/keycloak:/opt/keycloak/data/import:ro
    ports: ["127.0.0.1:${KEYCLOAK_PORT}:8080"]
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000
          && printf 'GET /health/ready HTTP/1.0\r\n\r\n' >&3 && grep -q UP <&3
      interval: 5s
      timeout: 5s
      retries: 60
