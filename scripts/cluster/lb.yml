# Failure-suite load balancer (scripts/cluster_test.sh): the nginx sample from
# docs/examples/multi-node/ in front of worker-1..3, with a self-signed certificate, on host port 9443.
name: mf-lb

services:
  lb:
    image: nginx:1.27
    ports:
      - "9443:443"
    volumes:
      - ../../docs/examples/multi-node/nginx.conf:/etc/nginx/nginx.conf:ro
      - ${MF_CLUSTER_TLS:?}:/etc/nginx/tls:ro
    networks: [cluster]

networks:
  cluster:
    name: megooflags-cluster
    external: true
