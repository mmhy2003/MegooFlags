# Override for CI and local smoke tests: run locally built images on a non-privileged port.
services:
  caddy:
    ports: !override
      - "${MEGOOFLAGS_HTTP_PORT:-8080}:80"
  web:
    image: megooflags-web:ci
    pull_policy: never
  migrate:
    image: megooflags-api:ci
    pull_policy: never
  api:
    image: megooflags-api:ci
    pull_policy: never
