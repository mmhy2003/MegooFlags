{{- if .Values.metrics.serviceMonitor.enabled }}
{{- $monitor := .Values.metrics.serviceMonitor }}
# Scrapes /metrics of the api (or worker) Service for the Prometheus Operator.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "megooflags.fullname" . }}
  labels:
    {{- include "megooflags.labels" . | nindent 4 }}
    {{- with $monitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "megooflags.selectorLabels" (dict "ctx" $ "component" (eq .Values.role "worker" | ternary "worker" "api")) | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ $monitor.interval }}
{{- end }}
