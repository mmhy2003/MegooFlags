{{- if ne .Values.role "worker" }}
{{- $fullname := include "megooflags.fullname" . }}
{{- $image := include "megooflags.image" (dict "ctx" $ "name" "megooflags-api") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "megooflags.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "megooflags.selectorLabels" (dict "ctx" $ "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "megooflags.selectorLabels" (dict "ctx" $ "component" "api") | nindent 8 }}
      annotations:
        {{- include "megooflags.podAnnotations" (dict "ctx" $ "extra" .Values.api.podAnnotations) | nindent 8 }}
    spec:
      {{- include "megooflags.podSecurity" . | nindent 6 }}
      {{- with include "megooflags.scheduling" .Values.api }}
      {{- . | nindent 6 }}
      {{- end }}
      initContainers:
        # Waits until the migration Job has brought the database to this image's head.
        - name: wait-for-migrations
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /bin/sh
            - -c
            - |
              until alembic current 2>/dev/null | grep -q '(head)'; do
                echo "waiting for the database to reach this image's migration head"
                sleep 5
              done
          {{- include "megooflags.envFrom" . | nindent 10 }}
          {{- include "megooflags.containerSecurity" . | nindent 10 }}
      containers:
        - name: api
          image: {{ $image }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          {{- include "megooflags.envFrom" . | nindent 10 }}
          {{- with .Values.api.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "megooflags.containerSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-api
  labels:
    {{- include "megooflags.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    {{- include "megooflags.selectorLabels" (dict "ctx" $ "component" "api") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
      protocol: TCP
{{- end }}
