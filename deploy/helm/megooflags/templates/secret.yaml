{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "megooflags.fullname" . }}
  labels:
    {{- include "megooflags.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if eq .Values.role "worker" }}
  {{- range $i, $token := .Values.worker.nodeTokens }}
  token-{{ $i }}: {{ $token | quote }}
  {{- end }}
  {{- else }}
  {{- $fullname := include "megooflags.fullname" . }}
  MEGOOFLAGS_SECRET_KEY: {{ .Values.secretKey | quote }}
  {{- if .Values.postgresql.enabled }}
  MEGOOFLAGS_DATABASE_URL: {{ printf "postgresql+asyncpg://megooflags:%s@%s-postgresql:5432/megooflags" (urlquery .Values.postgresql.password) $fullname | quote }}
  {{- else }}
  MEGOOFLAGS_DATABASE_URL: {{ .Values.externalDatabase.url | quote }}
  {{- end }}
  {{- if .Values.valkey.enabled }}
  MEGOOFLAGS_VALKEY_URL: {{ printf "redis://%s-valkey:6379/0" $fullname | quote }}
  {{- else }}
  MEGOOFLAGS_VALKEY_URL: {{ .Values.externalValkey.url | quote }}
  {{- end }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ .Values.postgresql.password | quote }}
  {{- end }}
  {{- end }}
{{- end }}
