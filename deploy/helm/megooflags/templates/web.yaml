{{- if ne .Values.role "worker" }}
{{- $fullname := include "megooflags.fullname" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "megooflags.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "megooflags.selectorLabels" (dict "ctx" $ "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "megooflags.selectorLabels" (dict "ctx" $ "component" "web") | nindent 8 }}
      annotations:
        {{- include "megooflags.podAnnotations" (dict "ctx" $ "extra" .Values.web.podAnnotations) | nindent 8 }}
    spec:
      {{- include "megooflags.podSecurity" . | nindent 6 }}
      {{- with include "megooflags.scheduling" .Values.web }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "megooflags.image" (dict "ctx" $ "name" "megooflags-web") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: MEGOOFLAGS_API_URL
              value: {{ printf "http://%s-api:8000" $fullname | quote }}
            {{- with .Values.web.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          # TCP only: the pages call the API, which may not be ready yet.
          livenessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 5
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- include "megooflags.containerSecurity" . | nindent 10 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $fullname }}-web
  labels:
    {{- include "megooflags.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  type: ClusterIP
  selector:
    {{- include "megooflags.selectorLabels" (dict "ctx" $ "component" "web") | nindent 4 }}
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
{{- end }}
