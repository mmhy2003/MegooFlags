    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sdk-e2e-stack
        with:
          project: megooflags-sdk-dotnet
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"
      - name: E2E
        working-directory: sdks/dotnet
        run: dotnet test -c Release --filter "Category=E2E"
      - if: failure()
        run: docker compose -p megooflags-sdk-dotnet -f deploy/docker-compose.yml -f deploy/compose.ci.yml logs --no-color
      - if: always()
        run: docker compose -p megooflags-sdk-dotnet -f deploy/docker-compose.yml -f deploy/compose.ci.yml down -v

