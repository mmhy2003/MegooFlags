name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - run: python3 scripts/check_version.py
      - run: uv run --frozen --project api pytest scripts/tests

  api-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - run: uv sync --frozen
      - run: uv run ruff check . ../scripts
      - run: uv run ruff format --check . ../scripts
      - run: uv run mypy

  api-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: megooflags
          POSTGRES_PASSWORD: megooflags
          POSTGRES_DB: megooflags
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U megooflags" --health-interval 5s
          --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      MEGOOFLAGS_DATABASE_URL: postgresql+asyncpg://megooflags:megooflags@localhost:5432/megooflags
      MEGOOFLAGS_VALKEY_URL: redis://localhost:6379/0
      MEGOOFLAGS_KEYCLOAK_URL: http://localhost:8180
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Keycloak for the SSO end-to-end tests
        working-directory: .
        env:
          # Compose checks it for the api service, which is not started here.
          MEGOOFLAGS_SECRET_KEY: ci-dummy-secret-key-not-used-0123456789
        run: docker compose -f deploy/docker-compose.yml -f deploy/compose.ci.yml --profile keycloak up -d --wait --wait-timeout 300 keycloak
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - run: uv sync --frozen
      - run: uv run pytest -v

  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:  # same block as api-test
        image: postgres:16
        env:
          POSTGRES_USER: megooflags
          POSTGRES_PASSWORD: megooflags
          POSTGRES_DB: megooflags
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U megooflags" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      MEGOOFLAGS_DATABASE_URL: postgresql+asyncpg://megooflags:megooflags@localhost:5432/megooflags
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - run: bash scripts/check_migrations.sh

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: OpenAPI spec and client drift
        working-directory: .
        run: |
          uv run --frozen --project api python -m megooflags_api.export_openapi api/openapi.json
          pnpm --dir web gen:api
          git diff --exit-code -- api/openapi.json web/lib/api/schema.d.ts \
            || { echo "::error::api/openapi.json or web/lib/api/schema.d.ts is stale. Run the commands in AGENTS.md and commit."; exit 1; }

  web-e2e:
    runs-on: ubuntu-24.04
    # Pinned to @playwright/test in web/package.json, so visual baselines match (e2e/docker.sh).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    services:
      postgres:  # same block as api-test, reached by service name
        image: postgres:16
        env:
          POSTGRES_USER: megooflags
          POSTGRES_PASSWORD: megooflags
          POSTGRES_DB: megooflags
        options: >-
          --health-cmd "pg_isready -U megooflags" --health-interval 5s
          --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      MEGOOFLAGS_DATABASE_URL: postgresql+asyncpg://megooflags:megooflags@postgres:5432/megooflags
      MEGOOFLAGS_VALKEY_URL: redis://valkey:6379/0
      MEGOOFLAGS_SECRET_KEY: ci-e2e-secret-key-not-used-anywhere-else-0123456789
      # The browser's Origin, so sign-in passes the API's CSRF check.
      MEGOOFLAGS_PUBLIC_URL: http://localhost:3000
      MEGOOFLAGS_API_URL: http://localhost:8000
      MEGOOFLAGS_API_WORKERS: "1"
      # integrations.spec.ts sends webhooks to a receiver on 127.0.0.1.
      MEGOOFLAGS_WEBHOOK_ALLOW_PRIVATE: "true"
      # nodes.spec.ts and the Nodes page need the Nodes API, which only a control plane serves.
      MEGOOFLAGS_ROLE: control-plane
      MEGOOFLAGS_UI_KIT: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      # uv uses the image's Python 3.12, which ships without headers (Python.h).
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential python3-dev libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: API dependencies
        working-directory: api
        run: uv sync --frozen
      - name: Migrate
        working-directory: api
        run: uv run alembic upgrade head
      - name: API
        working-directory: api
        run: |
          # Not `uv run`: a live uv process holds the cache lock and blocks setup-uv's post-job prune.
          nohup .venv/bin/python -m megooflags_api.serve > /tmp/api.log 2>&1 &
          for _ in $(seq 60); do
            if curl -fsS http://localhost:8000/readyz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "API not ready after 60 s:"
          cat /tmp/api.log
          exit 1
      - name: Build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: E2E
        working-directory: web
        run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: |
            web/playwright-report
            web/test-results
            /tmp/api.log

  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: false
          tags: megooflags-${{ matrix.image }}:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    runs-on: ubuntu-24.04
    needs: images
    strategy:
      fail-fast: false
      matrix:
        mode: [http, https]
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: api
          load: true
          tags: megooflags-api:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: megooflags-web:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web
      - run: bash scripts/smoke.sh ${{ matrix.mode }}

  # The documented quick start (site/src/content/docs/start/quick-start.mdx) in under five minutes.
  quickstart:
    runs-on: ubuntu-24.04
    needs: images
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: api
          load: true
          tags: megooflags-api:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: megooflags-web:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web
      - run: bash scripts/quickstart_test.sh

  # The reverse proxy samples (docs/examples/proxies/) in front of the bundle, SDK streams included.
  proxies:
    runs-on: ubuntu-24.04
    needs: images
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: api
          load: true
          tags: megooflags-api:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: megooflags-web:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web
      - run: bash scripts/proxy_samples_test.sh

  # The multi-node failure suite (PRD 8.5): a control plane, three workers and a load balancer.
  cluster:
    runs-on: ubuntu-24.04
    needs: images
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: api
          load: true
          tags: megooflags-api:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: megooflags-web:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web
      - run: bash scripts/cluster_test.sh
        env:
          MF_CLUSTER_LOGS: ${{ runner.temp }}/cluster-logs
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: cluster-logs
          path: ${{ runner.temp }}/cluster-logs

  cli:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: cli
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
      - run: go vet ./...
      - name: go vet (e2e)
        working-directory: cli/e2e
        run: go vet -tags e2e ./...
      - run: go test -race -count=1 ./...
      - run: go build -o bin/megooflags ./cmd/megooflags

  terraform:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: terraform/go.mod
          cache-dependency-path: |
            terraform/go.sum
            cli/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build -o bin/terraform-provider-megooflags .
      - name: docs up to date
        run: go tool tfplugindocs generate --provider-name megooflags && git diff --exit-code -- docs

  terraform-e2e:
    runs-on: ubuntu-24.04
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sdk-e2e-stack
        with:
          project: megooflags-terraform
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: terraform/go.mod
          cache-dependency-path: |
            terraform/go.sum
            cli/go.sum
      - name: E2E
        working-directory: terraform
        run: TF_ACC=1 go test -count=1 -v -run TestAcc ./...
      - if: failure()
        run: docker compose -p megooflags-terraform -f deploy/docker-compose.yml -f deploy/compose.ci.yml logs --no-color
      - if: always()
        run: docker compose -p megooflags-terraform -f deploy/docker-compose.yml -f deploy/compose.ci.yml down -v

  cli-e2e:
    runs-on: ubuntu-24.04
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sdk-e2e-stack
        with:
          project: megooflags-cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: |
            cli/go.sum
            cli/e2e/go.sum
      - name: E2E
        working-directory: cli/e2e
        run: go test -tags e2e -count=1 -v ./...
      - if: failure()
        run: docker compose -p megooflags-cli -f deploy/docker-compose.yml -f deploy/compose.ci.yml logs --no-color
      - if: always()
        run: docker compose -p megooflags-cli -f deploy/docker-compose.yml -f deploy/compose.ci.yml down -v

  sdk-go:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: sdks/go
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo "::error::gofmt"; exit 1; }
      - run: go vet ./...
      - run: go vet -tags e2e ./...
      - run: go test -race -count=1 ./...
      - name: Conformance and the p99 guard (without the race detector)
        run: go test -count=1 -run 'TestConformance|TestEvaluateP99' -v ./...

  sdk-go-e2e:
    runs-on: ubuntu-24.04
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sdk-e2e-stack
        with:
          project: megooflags-sdk-go
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdks/go/go.mod
          cache-dependency-path: sdks/go/go.sum
      - name: E2E
        working-directory: sdks/go
        run: go test -tags e2e -count=1 -v ./e2e
      - if: failure()
        run: docker compose -p megooflags-sdk-go -f deploy/docker-compose.yml -f deploy/compose.ci.yml logs --no-color
      - if: always()
        run: docker compose -p megooflags-sdk-go -f deploy/docker-compose.yml -f deploy/compose.ci.yml down -v

  sdk-node:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24", "26"]
    defaults:
      run:
        working-directory: sdks/node
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/node/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: sdks/node/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: p99 guard
        run: pnpm test:p99
      - run: pnpm build
      - run: pnpm pack

  sdk-node-e2e:
    runs-on: ubuntu-24.04
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sdk-e2e-stack
        with:
          project: megooflags-sdk-node
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: sdks/node/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: sdks/node/pnpm-lock.yaml
      - name: E2E
        working-directory: sdks/node
        run: pnpm install --frozen-lockfile && pnpm e2e
      - if: failure()
        run: docker compose -p megooflags-sdk-node -f deploy/docker-compose.yml -f deploy/compose.ci.yml logs --no-color
      - if: always()
        run: docker compose -p megooflags-sdk-node -f deploy/docker-compose.yml -f deploy/compose.ci.yml down -v

  sdk-python:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    defaults:
      run:
        working-directory: sdks/python
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest
      - name: p99 guard
        run: uv run pytest perf -s
      - run: uv build

  sdk-python-e2e:
    runs-on: ubuntu-24.04
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sdk-e2e-stack
        with:
          project: megooflags-sdk-python
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: sdks/python/uv.lock
      - name: E2E
        working-directory: sdks/python
        run: uv sync --frozen && uv run pytest e2e -v
      - if: failure()
        run: docker compose -p megooflags-sdk-python -f deploy/docker-compose.yml -f deploy/compose.ci.yml logs --no-color
      - if: always()
        run: docker compose -p megooflags-sdk-python -f deploy/docker-compose.yml -f deploy/compose.ci.yml down -v

  sdk-java:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ["11", "17", "21", "25"]
    defaults:
      run:
        working-directory: sdks/java
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
          cache-dependency-path: sdks/java/pom.xml
      - run: mvn -B -ntp verify
      - name: p99 guard
        run: mvn -B -ntp test -Pp99

  sdk-java-e2e:
    runs-on: ubuntu-24.04
    needs: images
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/sdk-e2e-stack
        with:
          project: megooflags-sdk-java
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
          cache-dependency-path: sdks/java/pom.xml
      - name: E2E
        working-directory: sdks/java
        run: mvn -B -ntp test -Pe2e
      - if: failure()
        run: docker compose -p megooflags-sdk-java -f deploy/docker-compose.yml -f deploy/compose.ci.yml logs --no-color
      - if: always()
        run: docker compose -p megooflags-sdk-java -f deploy/docker-compose.yml -f deploy/compose.ci.yml down -v

  sdk-dotnet:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - dotnet: "8.0.x"
            tfm: net8.0
          - dotnet: "10.0.x"
            tfm: net10.0
    defaults:
      run:
        working-directory: sdks/dotnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ matrix.dotnet }}
      - run: dotnet format --verify-no-changes
      - run: dotnet build -c Release -p:TestTargetFramework=${{ matrix.tfm }}
      - run: dotnet test -c Release --no-build -p:TestTargetFramework=${{ matrix.tfm }} --filter "Category!=P99&Category!=E2E"
      - name: p99 guard
        run: dotnet test -c Release --no-build -p:TestTargetFramework=${{ matrix.tfm }} --filter "Category=P99"
      - run: dotnet pack src/MegooFlags -c Release --no-build -o out

