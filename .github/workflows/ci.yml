name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  version:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - run: python3 scripts/check_version.py
      - run: uv run --frozen --project api pytest scripts/tests

  api-lint:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - run: uv sync --frozen
      - run: uv run ruff check . ../scripts
      - run: uv run ruff format --check . ../scripts
      - run: uv run mypy

  api-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: megooflags
          POSTGRES_PASSWORD: megooflags
          POSTGRES_DB: megooflags
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U megooflags" --health-interval 5s
          --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8
        ports: ["6379:6379"]
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      MEGOOFLAGS_DATABASE_URL: postgresql+asyncpg://megooflags:megooflags@localhost:5432/megooflags
      MEGOOFLAGS_VALKEY_URL: redis://localhost:6379/0
      MEGOOFLAGS_KEYCLOAK_URL: http://localhost:8180
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - name: Keycloak for the SSO end-to-end tests
        working-directory: .
        env:
          # Compose checks it for the api service, which is not started here.
          MEGOOFLAGS_SECRET_KEY: ci-dummy-secret-key-not-used-0123456789
        run: docker compose -f deploy/docker-compose.yml -f deploy/compose.ci.yml --profile keycloak up -d --wait --wait-timeout 300 keycloak
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - run: uv sync --frozen
      - run: uv run pytest -v

  migrations:
    runs-on: ubuntu-24.04
    services:
      postgres:  # same block as api-test
        image: postgres:16
        env:
          POSTGRES_USER: megooflags
          POSTGRES_PASSWORD: megooflags
          POSTGRES_DB: megooflags
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U megooflags" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      MEGOOFLAGS_DATABASE_URL: postgresql+asyncpg://megooflags:megooflags@localhost:5432/megooflags
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - run: bash scripts/check_migrations.sh

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: OpenAPI spec and client drift
        working-directory: .
        run: |
          uv run --frozen --project api python -m megooflags_api.export_openapi api/openapi.json
          pnpm --dir web gen:api
          git diff --exit-code -- api/openapi.json web/lib/api/schema.d.ts \
            || { echo "::error::api/openapi.json or web/lib/api/schema.d.ts is stale. Run the commands in AGENTS.md and commit."; exit 1; }

  web-e2e:
    runs-on: ubuntu-24.04
    # Pinned to @playwright/test in web/package.json, so visual baselines match (e2e/docker.sh).
    container:
      image: mcr.microsoft.com/playwright:v1.65.0-noble
      options: --ipc=host
    services:
      postgres:  # same block as api-test, reached by service name
        image: postgres:16
        env:
          POSTGRES_USER: megooflags
          POSTGRES_PASSWORD: megooflags
          POSTGRES_DB: megooflags
        options: >-
          --health-cmd "pg_isready -U megooflags" --health-interval 5s
          --health-timeout 5s --health-retries 20
      valkey:
        image: valkey/valkey:8
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s
          --health-timeout 5s --health-retries 20
    env:
      MEGOOFLAGS_DATABASE_URL: postgresql+asyncpg://megooflags:megooflags@postgres:5432/megooflags
      MEGOOFLAGS_VALKEY_URL: redis://valkey:6379/0
      MEGOOFLAGS_SECRET_KEY: ci-e2e-secret-key-not-used-anywhere-else-0123456789
      # The browser's Origin, so sign-in passes the API's CSRF check.
      MEGOOFLAGS_PUBLIC_URL: http://localhost:3000
      MEGOOFLAGS_API_URL: http://localhost:8000
      MEGOOFLAGS_API_WORKERS: "1"
      MEGOOFLAGS_UI_KIT: "1"
      HOME: /root
    steps:
      - uses: actions/checkout@v4
      # uv uses the image's Python 3.12, which ships without headers (Python.h).
      - name: SAML build dependencies (lxml and xmlsec are built from source)
        run: apt-get update && apt-get install -y --no-install-recommends build-essential python3-dev libxml2-dev libxslt1-dev libxmlsec1-dev pkg-config
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - name: API dependencies
        working-directory: api
        run: uv sync --frozen
      - name: Migrate
        working-directory: api
        run: uv run alembic upgrade head
      - name: API
        working-directory: api
        run: |
          nohup uv run python -m megooflags_api.serve > /tmp/api.log 2>&1 &
          for _ in $(seq 60); do
            if curl -fsS http://localhost:8000/readyz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "API not ready after 60 s:"
          cat /tmp/api.log
          exit 1
      - name: Build
        working-directory: web
        run: pnpm install --frozen-lockfile && pnpm build
      - name: E2E
        working-directory: web
        run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-e2e
          path: |
            web/playwright-report
            web/test-results
            /tmp/api.log

  images:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        image: [api, web]
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: false
          tags: megooflags-${{ matrix.image }}:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  smoke:
    runs-on: ubuntu-24.04
    needs: images
    strategy:
      fail-fast: false
      matrix:
        mode: [http, https]
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: api
          load: true
          tags: megooflags-api:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=api
      - uses: docker/build-push-action@v6
        with:
          context: web
          load: true
          tags: megooflags-web:ci
          build-args: |
            VERSION=${{ steps.v.outputs.version }}
            REVISION=${{ github.sha }}
          cache-from: type=gha,scope=web
      - run: bash scripts/smoke.sh ${{ matrix.mode }}
