  sdk-ios:
    runs-on: macos-15
    defaults:
      run:
        working-directory: sdks/ios
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 16.4 (Swift 6.1)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: swift --version
      - uses: actions/cache@v4
        with:
          path: sdks/ios/.build
          key: sdk-ios-${{ runner.os }}-${{ hashFiles('sdks/ios/Package.resolved') }}
      - run: swift format lint --strict --recursive Sources Tests Package.swift
      - run: swift build
      - run: swift test --filter MegooFlagsTests
      - name: Build for iOS
        run: xcodebuild -scheme MegooFlags -destination 'generic/platform=iOS' build

  sdk-ios-e2e:
    # macOS runners have no Docker: Postgres, Valkey and the API run natively, as in web-e2e.
    runs-on: macos-15
    timeout-minutes: 45
    env:
      MEGOOFLAGS_DATABASE_URL: postgresql+asyncpg://megooflags:megooflags@localhost:5432/megooflags
      MEGOOFLAGS_VALKEY_URL: redis://localhost:6379/0
      MEGOOFLAGS_SECRET_KEY: ci-sdk-ios-e2e-secret-key-not-used-elsewhere-0123456789
      MEGOOFLAGS_PUBLIC_URL: http://localhost:8000
      MEGOOFLAGS_API_WORKERS: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Postgres and Valkey
        run: |
          brew install postgresql@16 valkey libxmlsec1 libxml2 pkg-config
          brew services start postgresql@16
          brew services start valkey
          pg="$(brew --prefix postgresql@16)/bin"
          for _ in $(seq 60); do
            if "$pg/pg_isready" -h localhost -q; then break; fi
            sleep 1
          done
          "$pg/pg_isready" -h localhost
          "$pg/psql" -d postgres -c "CREATE ROLE megooflags LOGIN SUPERUSER PASSWORD 'megooflags'"
          "$pg/createdb" -O megooflags megooflags
          # libxml2 is keg-only: lxml and xmlsec find it through pkg-config.
          echo "PKG_CONFIG_PATH=$(brew --prefix libxml2)/lib/pkgconfig:${PKG_CONFIG_PATH:-}" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true
          cache-dependency-glob: api/uv.lock
      - name: API dependencies
        working-directory: api
        run: uv sync --frozen
      - name: Migrate
        working-directory: api
        run: uv run alembic upgrade head
      - name: API
        working-directory: api
        run: |
          # Not `uv run`: a live uv process holds the cache lock and blocks setup-uv's post-job prune.
          nohup .venv/bin/python -m megooflags_api.serve > /tmp/api.log 2>&1 &
          for _ in $(seq 60); do
            if curl -fsS http://localhost:8000/readyz > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "API not ready after 60 s:"
          cat /tmp/api.log
          exit 1
      - name: API token
        run: |
          token="$(bash scripts/sdk_e2e_token.sh http://localhost:8000)"
          echo "::add-mask::$token"
          echo "MEGOOFLAGS_E2E_URL=http://localhost:8000" >> "$GITHUB_ENV"
          echo "MEGOOFLAGS_API_TOKEN=$token" >> "$GITHUB_ENV"
      - name: Xcode 16.4 (Swift 6.1)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - uses: actions/cache@v4
        with:
          path: sdks/ios/.build
          key: sdk-ios-e2e-${{ runner.os }}-${{ hashFiles('sdks/ios/Package.resolved') }}
      - name: E2E
        working-directory: sdks/ios
        run: swift test --filter MegooFlagsE2ETests
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: sdk-ios-e2e
          path: /tmp/api.log

