            sdks/js/pnpm-lock.yaml
            sdks/react/pnpm-lock.yaml
      - name: Build @megooflags/js
        run: pnpm --dir ../js install --frozen-lockfile && pnpm --dir ../js build
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
