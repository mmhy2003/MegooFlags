      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: |
            sdks/js/pnpm-lock.yaml
            sdks/react/pnpm-lock.yaml
            sdks/react-native/pnpm-lock.yaml
      - name: Build @megooflags/js
        run: pnpm --dir ../js install --frozen-lockfile && pnpm --dir ../js build
      - name: Build @megooflags/react
