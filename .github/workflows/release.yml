  sdk-android-release:
    if: startsWith(github.ref_name, 'sdk-android/v')
    needs: sdk-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/android
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches gradle.properties
        working-directory: .
        run: python3 scripts/check_sdk_version.py --sdk android --tag "$GITHUB_REF_NAME"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew spotlessCheck lint testDebugUnitTest assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: sdk-android
          path: sdks/android/build/outputs/aar/*.aar
          if-no-files-found: error
      - name: Publish to Maven Central
        if: vars.SDK_PUBLISH_ANDROID == 'true' && !contains(github.ref_name, '-rc.')
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: ./gradlew publishAndReleaseToMavenCentral --no-configuration-cache

  sdk-flutter-release:
    if: startsWith(github.ref_name, 'sdk-flutter/v')
    needs: sdk-tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/flutter
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches pubspec.yaml
        working-directory: .
        run: python3 scripts/check_sdk_version.py --sdk flutter --tag "$GITHUB_REF_NAME"
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test
      - run: flutter pub publish --dry-run

  sdk-flutter-publish:
    # pub.dev publishes from the source (it has no artifact upload), so this job runs pub get with the
    # OIDC token; the only dependencies are openfeature_dart_client_sdk, http and shared_preferences.
    needs: sdk-flutter-release
    if: vars.SDK_PUBLISH_FLUTTER == 'true' && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
      contents: read
    defaults:
      run:
        working-directory: sdks/flutter
    steps:
      - uses: actions/checkout@v4
      # Configures the pub.dev OIDC credentials (trusted publishing); no token.
      - uses: dart-lang/setup-dart@v1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.38.x
      - name: Publish to pub.dev
        run: flutter pub get && flutter pub publish --force
