  sdk-ios-release:
    if: startsWith(github.ref_name, 'sdk-ios/v')
    needs: sdk-tag
    runs-on: macos-15
    permissions:
      contents: read
    defaults:
      run:
        working-directory: sdks/ios
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Version.swift
        working-directory: .
        run: python3 scripts/check_sdk_version.py --sdk ios --tag "$GITHUB_REF_NAME"
      - name: Xcode 16.4 (Swift 6.1)
        run: sudo xcode-select -s /Applications/Xcode_16.4.app
      - run: swift format lint --strict --recursive Sources Tests Package.swift
      - run: swift build
      - run: swift test --filter MegooFlagsTests

  sdk-ios-publish:
    needs: sdk-ios-release
    if: vars.SDK_PUBLISH_IOS == 'true' && !contains(github.ref_name, '-rc.')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # No GITHUB_TOKEN header in .git/config: it would override the split token on the push.
          persist-credentials: false
      - name: Publish to the SwiftPM split repository
        # SwiftPM reads the read-only split repository: sdks/ios as its root, tagged X.Y.Z (no "v").
        env:
          SDK_IOS_SPLIT_TOKEN: ${{ secrets.SDK_IOS_SPLIT_TOKEN }}
          SPLIT_REPO: ${{ vars.SDK_IOS_SPLIT_REPO || 'mmhy2003/megooflags-swift' }}
        run: |
          version="${GITHUB_REF_NAME#sdk-ios/v}"
          git subtree split --prefix=sdks/ios -b sdk-ios-split
          git push "https://x-access-token:${SDK_IOS_SPLIT_TOKEN}@github.com/${SPLIT_REPO}.git" \
